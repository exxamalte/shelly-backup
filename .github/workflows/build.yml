name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      USING_COVERAGE: '3.14'
    strategy:
      fail-fast: true
      matrix:
        python-version: [ '3.14' ]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python "${{ matrix.python-version }}"
      uses: actions/setup-python@v7
      with:
        python-version: "${{ matrix.python-version }}"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[tests]"
    - name: Run tests for ${{ matrix.python-version }}
      run: |
        python -m pytest tests/ -qq --timeout=9 --durations=10 -n auto --cov shelly_backup --cov-report xml -o console_output_style=count -p no:sugar -v
        python -m coverage xml
    - name: Upload coverage to Codecov
      if: "contains(env.USING_COVERAGE, matrix.python-version)"
      uses: "codecov/codecov-action@v7"
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  createrelease:
    name: Create Release
    runs-on: [ubuntu-latest]
    needs: test
    outputs:
      release_url: ${{ steps.release_url.outputs.release_url }}
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: ${{ contains( github.ref_name, 'b' ) }}
    - name: Output Release URL
      id: release_url
      run: echo "release_url=${{ steps.create_release.outputs.upload_url }}" >> $GITHUB_OUTPUT

  build:
    name: Build packages
    needs: createrelease
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            TARGET: linux
            ARCH: x64
            PYARCH: x64
            CMD_BUILD: >
                pyinstaller cli.spec &&
                cd dist/ &&
                tar cfz shellybackup.tar.gz shellybackup
            OUT_FILE_NAME: shellybackup.tar.gz
            ASSET_MIME: application/gzip
          - os: ubuntu-24.04-arm
            TARGET: linux
            ARCH: arm64
            PYARCH: arm64
            CMD_BUILD: >
                pyinstaller cli.spec &&
                cd dist/ &&
                tar cfz shellybackup.tar.gz shellybackup
            OUT_FILE_NAME: shellybackup.tar.gz
            ASSET_MIME: application/gzip
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
        architecture: ${{ matrix.PYARCH }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: Write release version
      id: version
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo Version: $VERSION
        echo "version_number=$VERSION" >> $GITHUB_OUTPUT
    - name: Build with pyinstaller for ${{matrix.TARGET}}
      run: ${{matrix.CMD_BUILD}}
    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.createrelease.outputs.release_url }}
        asset_path: ./dist/${{ matrix.OUT_FILE_NAME}}
        asset_name: shellybackup-${{steps.version.outputs.version_number}}-${{ matrix.TARGET }}-${{ matrix.ARCH }}.tar.gz
        asset_content_type: ${{ matrix.ASSET_MIME}}
